<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Picture Hunt! 📸</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFF8E7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
  <link rel="stylesheet" href="style.css?v=85">
  <link rel="stylesheet" href="parent-dashboard.css?v=85">
  <link rel="stylesheet" href="content/animations/new-celebrations.css?v=85">
  <link rel="stylesheet" href="content/sticker-book.css?v=85">
  <link rel="stylesheet" href="content/daily-challenge-streak.css?v=85">
  <link rel="stylesheet" href="paywall.css?v=85">
</head>
<body>
  <!-- Landing Screen -->
  <div id="landing" class="screen active">
    <div class="landing-content">
      <img class="landing-fox" src="img/mascot/fox-hero.png" alt="" aria-hidden="true">
      <h1 class="title-bounce">📸 Picture Hunt!</h1>
      <p class="landing-sub">A photo adventure awaits!</p>
      <button class="landing-play-btn pulse" onclick="startFromLanding()">
        📷 Let's Play!
      </button>
    </div>
  </div>

  <!-- Home Screen (Category Select) -->
  <div id="splash" class="screen">
    <div class="splash-content">
      <h1 class="home-title">Choose a Category</h1>
      <div id="storyline-feature"></div>
      <div id="category-grid" class="category-grid"></div>
      <div class="splash-bottom">
        <button id="setup-btn" class="setup-icon-btn" onclick="openSetup()" aria-label="Settings"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
        <button id="sound-toggle" class="setup-icon-btn" onclick="toggleSound()" aria-label="Toggle sound"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg></button>
      </div>
    </div>
  </div>

  <!-- Setup Screen -->
  <div id="setup" class="screen">
    <div class="setup-container">
      <h1 class="setup-header">⚙️ Pick the items!</h1>
      <div id="category-tabs" class="category-tabs"></div>
      <div class="setup-toolbar">
        <button id="select-all-btn" class="setup-tool-btn">✅ All</button>
        <button id="clear-all-btn" class="setup-tool-btn">❌ Clear</button>
      </div>
      <p id="setup-msg" class="setup-msg">0 items selected</p>
      <div id="setup-grid" class="setup-grid"></div>
      <button id="setup-done-btn" class="big-btn play-btn setup-done-btn">Done ✅</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game" class="screen">
    <div class="game-top">
      <button class="home-btn" onclick="goHome()" aria-label="Home"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg></button>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
    <div id="target-area" class="target-area">
      <div id="target-emoji" class="target-emoji"></div>
      <div id="target-text" class="target-text"></div>
      <button class="repeat-btn" onclick="repeatPrompt()" aria-label="Hear it again"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg></button>
    </div>
    <div id="feedback-area" class="feedback-area"></div>
    <div id="camera-area" class="camera-area">
      <label id="camera-label" class="big-btn camera-btn">
        📷
        <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="handlePhoto(this)">
      </label>
    </div>
    <div class="skip-area">
      <button class="skip-btn" onclick="skipItem()" aria-label="Skip"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></button>
    </div>
    <div id="loading" class="loading hidden">
      <img class="loading-fox" src="img/mascot/fox-search.png" alt="" aria-hidden="true">
      <div class="spinner"></div>
      <p>Looking at your photo...</p>
    </div>
  </div>

  <!-- Victory Screen -->
  <div id="victory" class="screen">
    <div class="victory-content">
      <h1 class="victory-title">🎉 You Did It! 🎉</h1>
      <img class="victory-fox" src="img/mascot/fox-celebrate.png" alt="" aria-hidden="true">
      <p id="victory-sub" class="victory-sub">You found everything!</p>
      <div id="victory-stats" class="victory-stats"></div>
      <div class="victory-buttons">
        <button class="big-btn play-btn" onclick="startNewGame()">
          🔄 Play Again!
        </button>
        <button class="big-btn setup-btn" onclick="resetGame()">
          🏠 Home
        </button>
      </div>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script src="content/translations/languages-config.js?v=85"></script>
  <script src="content/translations/all-translations.js?v=85"></script>
  <script src="app.js?v=85"></script>
  <script src="paywall.js?v=85"></script>
  <script src="progress-sync.js?v=85"></script>
  <script src="install-prompt.js?v=85"></script>
  <script src="content/rich-sound-fx.js?v=85"></script>
  <script src="hint-system.js?v=85"></script>
  <script src="content/animations/new-celebrations.js?v=85"></script>
  <script src="content/sticker-book.js?v=85"></script>
  <script src="content/daily-challenge-streak.js?v=85"></script>
  <script src="parent-dashboard.js?v=85"></script>
  <script src="storyline-mode.js?v=85"></script>
  <script src="content/seasonal-manager.js?v=85"></script>
  <script src="sw-register.js?v=85"></script>
</body>
</html>
