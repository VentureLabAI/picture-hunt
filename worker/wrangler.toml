name = "picture-hunt-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# Which Gemini models answer "is <item> in this photo?". The Worker asks PRIMARY
# first and FALLBACK once if PRIMARY fails. Changing a model is a one-line edit
# here plus `npx wrangler deploy`. No app update or cache bump is needed.
# Before switching, run the model comparison (C:\dev\ph-tools\model_compare.js).
[vars]
PRIMARY_MODEL = "gemini-3.5-flash-lite"
FALLBACK_MODEL = "gemini-3.6-flash"

# Keep request logs so a failing model shows up in the Cloudflare dashboard.
[observability]
enabled = true

# KV namespace for unlock codes — populated by Stripe webhook (see docs/PAYWALL-DEPLOY.md)
# Create with: npx wrangler kv:namespace create UNLOCK_CODES
# Then paste the returned id below and deploy.
[[kv_namespaces]]
binding = "UNLOCK_CODES"
id = "3984b5b16694406590dca6f5c6238a8b"

# Anonymous daily totals (landing visits, Try Free taps, photo checks, code use).
# One table of counters, no personal data. Schema: worker/schema.sql.
# Read with: node worker/stats.mjs
[[d1_databases]]
binding = "STATS"
database_name = "picture-hunt-stats"
database_id = "87c20b5b-e916-430b-b819-44e8748a2f95"

# Built-in rate limits, counted per visitor IP. period is seconds (10 or 60).
# RL_AI guards photo checks (the calls that cost money); RL_API guards code
# validation and progress sync.
[[ratelimits]]
name = "RL_AI"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_API"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60
